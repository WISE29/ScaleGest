{% extends "base.html" %}
{% block title %}{{ action }} chatter{% endblock %}
{% block page_title %}{{ action }} un chatter{% endblock %}
{% block content %}
<div class="form-container">
<form method="post" class="form-card">
  <div class="form-group">
    <label>Nom / Pseudo <span class="required">*</span></label>
    <input type="text" name="name" required value="{{ chatter.name if chatter else '' }}" placeholder="Ex : Jodess" />
  </div>
  <div class="form-group">
    <label>Statut</label>
    <select name="status">
      <option value="active"   {% if not chatter or chatter.status=='active' %}selected{% endif %}>Actif</option>
      <option value="inactive" {% if chatter and chatter.status=='inactive' %}selected{% endif %}>Inactif</option>
    </select>
  </div>
  <div class="form-group">
    <label>Date d'arrivée</label>
    <input type="date" name="date_joined" value="{{ chatter.date_joined if chatter else '' }}" />
  </div>
  <div class="form-group">
    <label>Shift permanent — Début</label>
    <input type="time" name="shift_start" value="{{ chatter.shift_start|short if chatter and chatter.shift_start else '' }}" />
  </div>
  <div class="form-group">
    <label>Shift permanent — Fin</label>
    <input type="time" name="shift_end" value="{{ chatter.shift_end|short if chatter and chatter.shift_end else '' }}" />
  </div>
  <div class="form-group">
    <label>Notes (facultatif)</label>
    <textarea name="notes" rows="3">{{ chatter.notes if chatter else '' }}</textarea>
  </div>
  <div class="form-actions">
    <a href="{{ url_for('manager.chatters_list') }}" class="btn btn-ghost">Annuler</a>
    <button type="submit" class="btn btn-primary">{{ action }}</button>
  </div>
</form>
</div>
{% endblock %}
