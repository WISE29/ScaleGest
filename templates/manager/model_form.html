{% extends "base.html" %}
{% block title %}{{ action }} modèle{% endblock %}
{% block page_title %}{{ action }} un modèle{% endblock %}
{% block content %}
<div class="form-container">
  <form method="post" class="form-card">
    <div class="form-group">
      <label>Nom / Pseudo <span class="required">*</span></label>
      <input type="text" name="name" required
             value="{{ model.name if model else '' }}"
             placeholder="Ex : Modèle A" autofocus />
    </div>
    <div class="form-group">
      <label>Notes (facultatif)</label>
      <textarea name="notes" rows="3"
                placeholder="Informations complémentaires…">{{ model.notes if model and model.notes else '' }}</textarea>
    </div>
    <div class="form-actions">
      <a href="{{ url_for('manager.models_list') }}" class="btn btn-ghost">Annuler</a>
      <button type="submit" class="btn btn-primary">{{ action }}</button>
    </div>
  </form>
</div>
{% endblock %}
